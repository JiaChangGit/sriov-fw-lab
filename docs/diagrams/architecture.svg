<svg xmlns="http://www.w3.org/2000/svg" width="1080" viewBox="0 0 1080 660" role="img" aria-labelledby="architecture-title"><title id="architecture-title">系統架構與各層所有權</title><defs><marker id="architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2b628f"/></marker></defs><rect width="100%" height="100%" fill="#fafcfe"/><g font-family="system-ui,Microsoft JhengHei,sans-serif"><text x="25" y="34" font-size="23" fill="#18344e" text-anchor="start"><tspan x="25" dy="0">執行位置與責任：Windows → WSL / QEMU → guest Linux</tspan></text><rect x="25" y="65" width="1030" height="75" rx="12" fill="#edf4fc" stroke="#7792ae"/><text x="43" y="96" font-size="19" fill="#18344e" text-anchor="start"><tspan x="43" dy="0">L0 · Windows 11 / 16 GB</tspan></text><text x="43" y="125" font-size="15" fill="#18344e" text-anchor="start"><tspan x="43" dy="0">WSL 管理與實體 RAM / SSD；不載入 toy PF driver</tspan></text><rect x="25" y="165" width="1030" height="470" rx="12" fill="#edf4fc" stroke="#7792ae"/><text x="43" y="196" font-size="19" fill="#18344e" text-anchor="start"><tspan x="43" dy="0">L1 · WSL2 Ubuntu 26.04</tspan></text><text x="43" y="225" font-size="15" fill="#18344e" text-anchor="start"><tspan x="43" dy="0">建置工具、Python controller、artifacts；一次一個 QEMU guest</tspan></text><rect x="55" y="255" width="360" height="140" rx="12" fill="#edf4fc" stroke="#7792ae"/><text x="73" y="286" font-size="19" fill="#18344e" text-anchor="start"><tspan x="73" dy="0">QEMU process / toy PCIe device</tspan></text><text x="73" y="315" font-size="15" fill="#18344e" text-anchor="start"><tspan x="73" dy="0">PF + 最多 8 VF / vIOMMU</tspan><tspan x="73" dy="22.5">VF requester DMA / fence / MSI-X</tspan><tspan x="73" dy="22.5">fwcore：VF 狀態機與 ledger</tspan></text><rect x="490" y="255" width="530" height="340" rx="12" fill="#edf4fc" stroke="#7792ae"/><text x="508" y="286" font-size="19" fill="#18344e" text-anchor="start"><tspan x="508" dy="0">L2 · 自建 Linux guest</tspan></text><text x="508" y="315" font-size="15" fill="#18344e" text-anchor="start"><tspan x="508" dy="0">guest kernel / Intel vIOMMU / VFIO</tspan></text><rect x="510" y="330" width="225" height="105" rx="12" fill="#edf4fc" stroke="#7792ae"/><text x="528" y="361" font-size="19" fill="#18344e" text-anchor="start"><tspan x="528" dy="0">PF driver + labd</tspan></text><text x="528" y="390" font-size="15" fill="#18344e" text-anchor="start"><tspan x="528" dy="0">管理交易、lease、pidfd</tspan><tspan x="528" dy="22.5">mailbox / READY / REARM</tspan></text><rect x="755" y="330" width="245" height="105" rx="12" fill="#edf4fc" stroke="#7792ae"/><text x="773" y="361" font-size="19" fill="#18344e" text-anchor="start"><tspan x="773" dy="0">tenant A / tenant B</tspan></text><text x="773" y="390" font-size="15" fill="#18344e" text-anchor="start"><tspan x="773" dy="0">獨立 VFIO fd + domain</tspan><tspan x="773" dy="22.5">SQ / CQ / payload / IRQ</tspan></text><path d="M735 390 L755 390" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/><path d="M490 485 L415 485" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/><text x="448" y="465" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="448" dy="0">PCI MMIO</tspan></text><path d="M415 520 L490 520" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#architecture-arrow)"/><text x="448" y="552" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="448" dy="0">DMA / IRQ</tspan></text><path d="M235 395 L235 520 L415 520 M235 485 L415 485" stroke="#2b628f" stroke-width="2" fill="none"/><text x="520" y="490" font-size="17" fill="#18344e" text-anchor="start"><tspan x="520" dy="0">CPU VA → guest physical pages</tspan><tspan x="520" dy="25.5">VF RID + IOVA → domain translation</tspan><tspan x="520" dy="25.5">PF 管理入口與 tenant 資料入口分離</tspan></text></g></svg>
