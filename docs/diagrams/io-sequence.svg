<svg xmlns="http://www.w3.org/2000/svg" width="1170" viewBox="0 0 1170 880" role="img" aria-labelledby="io-sequence-title"><title id="io-sequence-title">單筆 DMA 與 completion 的發布時序</title><defs><marker id="io-sequence-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2b628f"/></marker></defs><rect width="100%" height="100%" fill="#fafcfe"/><g font-family="system-ui,Microsoft JhengHei,sans-serif"><text x="25" y="36" font-size="22" fill="#18344e" text-anchor="start"><tspan x="25" dy="0">正常請求時序：資料完成、completion 可見與 IRQ 是不同事件</tspan></text><text x="120" y="86" font-size="17" fill="#18344e" text-anchor="middle"><tspan x="120" dy="0">tenant CPU</tspan></text><path d="M120 105 V805" stroke="#9cadbe" stroke-dasharray="5 5"/><text x="430" y="86" font-size="17" fill="#18344e" text-anchor="middle"><tspan x="430" dy="0">SQ / CQ memory</tspan></text><path d="M430 105 V805" stroke="#9cadbe" stroke-dasharray="5 5"/><text x="760" y="86" font-size="17" fill="#18344e" text-anchor="middle"><tspan x="760" dy="0">QEMU device</tspan></text><path d="M760 105 V805" stroke="#9cadbe" stroke-dasharray="5 5"/><text x="1040" y="86" font-size="17" fill="#18344e" text-anchor="middle"><tspan x="1040" dy="0">VF IOMMU</tspan></text><path d="M1040 105 V805" stroke="#9cadbe" stroke-dasharray="5 5"/><path d="M120 155 L430 155" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#io-sequence-arrow)"/><text x="275.0" y="143" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="275.0" dy="0">寫 descriptor / payload；release</tspan></text><path d="M120 225 L760 225" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#io-sequence-arrow)"/><text x="440.0" y="213" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="440.0" dy="0">SQ_TAIL → DOORBELL</tspan></text><path d="M760 295 L1040 295" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#io-sequence-arrow)"/><text x="900.0" y="283" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="900.0" dy="0">以 VF requester fetch SQ / payload</tspan></text><path d="M1040 365 L760 365" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#io-sequence-arrow)"/><text x="900.0" y="353" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="900.0" dy="0">translation + MemTxResult</tspan></text><path d="M760 435 L430 435" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#io-sequence-arrow)"/><text x="595.0" y="423" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="595.0" dy="0">CQ 內容與 reserved bytes</tspan></text><path d="M760 505 L430 505" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#io-sequence-arrow)"/><text x="595.0" y="493" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="595.0" dy="0">phase 最後發布 → CQ_TAIL</tspan></text><path d="M760 575 L120 575" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#io-sequence-arrow)"/><text x="440.0" y="563" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="440.0" dy="0">MSI-X → eventfd 通知</tspan></text><path d="M120 645 L430 645" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#io-sequence-arrow)"/><text x="275.0" y="633" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="275.0" dy="0">acquire phase → 核 id / epoch / status</tspan></text><path d="M120 715 L760 715" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#io-sequence-arrow)"/><text x="440.0" y="703" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="440.0" dy="0">更新 CQ_HEAD；允許重用 slot</tspan></text><text x="30" y="840" font-size="16" fill="#18344e" text-anchor="start"><tspan x="30" dy="0">eventfd counter 不是 completion 數量；以 CQ phase 判斷可見性，SQ slot 與 CQ slot 也不保證相同。</tspan></text></g></svg>
