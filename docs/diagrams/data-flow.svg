<svg xmlns="http://www.w3.org/2000/svg" width="1100" viewBox="0 0 1100 560" role="img" aria-labelledby="data-flow-title"><title id="data-flow-title">提交佇列、VF DMA、完成佇列與通知的資料流</title><defs><marker id="data-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2b628f"/></marker></defs><rect width="100%" height="100%" fill="#fafcfe"/><g font-family="system-ui,Microsoft JhengHei,sans-serif"><text x="25" y="36" font-size="23" fill="#18344e" text-anchor="start"><tspan x="25" dy="0">資料流：一筆 FILL / CRC32 的完整路徑</tspan></text><rect x="25" y="85" width="310" height="150" rx="12" fill="#edf4fc" stroke="#7792ae"/><text x="43" y="116" font-size="19" fill="#18344e" text-anchor="start"><tspan x="43" dy="0">1 · Tenant 發布 SQ</tspan></text><text x="43" y="145" font-size="15" fill="#18344e" text-anchor="start"><tspan x="43" dy="0">CPU 寫 32-byte LE descriptor</tspan><tspan x="43" dy="22.5">release → SQ_TAIL → DOORBELL</tspan><tspan x="43" dy="22.5">payload IOVA = 0x400000</tspan></text><rect x="395" y="85" width="310" height="150" rx="12" fill="#edf4fc" stroke="#7792ae"/><text x="413" y="116" font-size="19" fill="#18344e" text-anchor="start"><tspan x="413" dy="0">2 · Device fetch / validate</tspan></text><text x="413" y="145" font-size="15" fill="#18344e" text-anchor="start"><tspan x="413" dy="0">ACTIVE + config + BME + gate</tspan><tspan x="413" dy="22.5">保存 descriptor / generation</tspan><tspan x="413" dy="22.5">保留 CQ capacity，最多一筆 delay</tspan></text><rect x="765" y="85" width="310" height="150" rx="12" fill="#edf4fc" stroke="#7792ae"/><text x="783" y="116" font-size="19" fill="#18344e" text-anchor="start"><tspan x="783" dy="0">3 · VF requester + IOMMU</tspan></text><text x="783" y="145" font-size="15" fill="#18344e" text-anchor="start"><tspan x="783" dy="0">PCI_DEVICE(對應 VF)</tspan><tspan x="783" dy="22.5">RID 0101 / 0102 → 各自 domain</tspan><tspan x="783" dy="22.5">每次 helper 檢查 MemTxResult</tspan></text><path d="M335 160 L395 160" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#data-flow-arrow)"/><path d="M705 160 L765 160" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#data-flow-arrow)"/><rect x="765" y="305" width="310" height="155" rx="12" fill="#edf4fc" stroke="#7792ae"/><text x="783" y="336" font-size="19" fill="#18344e" text-anchor="start"><tspan x="783" dy="0">4 · Payload DMA</tspan></text><text x="783" y="365" font-size="15" fill="#18344e" text-anchor="start"><tspan x="783" dy="0">FILL 寫 / CRC32 讀</tspan><tspan x="783" dy="22.5">每 chunk 核對 gate / generation</tspan><tspan x="783" dy="22.5">跨頁失敗不保證回滾已寫 bytes</tspan></text><rect x="395" y="305" width="310" height="155" rx="12" fill="#edf4fc" stroke="#7792ae"/><text x="413" y="336" font-size="19" fill="#18344e" text-anchor="start"><tspan x="413" dy="0">5 · CQ 發布</tspan></text><text x="413" y="365" font-size="15" fill="#18344e" text-anchor="start"><tspan x="413" dy="0">內容與 reserved bytes → phase</tspan><tspan x="413" dy="22.5">phase 最後成功才更新 CQ_TAIL</tspan><tspan x="413" dy="22.5">再檢查 IRQ gate → MSI-X</tspan></text><rect x="25" y="305" width="310" height="155" rx="12" fill="#edf4fc" stroke="#7792ae"/><text x="43" y="336" font-size="19" fill="#18344e" text-anchor="start"><tspan x="43" dy="0">6 · Tenant 消費</tspan></text><text x="43" y="365" font-size="15" fill="#18344e" text-anchor="start"><tspan x="43" dy="0">eventfd 提醒 → acquire CQ phase</tspan><tspan x="43" dy="22.5">核 id / epoch / status / payload</tspan><tspan x="43" dy="22.5">完成檢查才更新 CQ_HEAD</tspan></text><path d="M920 235 L920 305" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#data-flow-arrow)"/><path d="M765 380 L705 380" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#data-flow-arrow)"/><path d="M395 380 L335 380" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#data-flow-arrow)"/><text x="35" y="520" font-size="18" fill="#18344e" text-anchor="start"><tspan x="35" dy="0">位址隔離：RID + domain + IOVA　　時間隔離：PF fence　　世代隔離：session / epoch / cancel token</tspan></text></g></svg>
