<svg xmlns="http://www.w3.org/2000/svg" width="1090" viewBox="0 0 1090 800" role="img" aria-labelledby="control-flow-title"><title id="control-flow-title">管理控制流程及錯誤反向回收</title><defs><marker id="control-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2b628f"/></marker></defs><rect width="100%" height="100%" fill="#fafcfe"/><g font-family="system-ui,Microsoft JhengHei,sans-serif"><text x="25" y="36" font-size="22" fill="#18344e" text-anchor="start"><tspan x="25" dy="0">控制流程：先保留資源，再公開 PCI VF；失敗反向收斂</tspan></text><rect x="25" y="85" width="605" height="100" rx="12" fill="#edf4fc" stroke="#7792ae"/><text x="43" y="116" font-size="19" fill="#18344e" text-anchor="start"><tspan x="43" dy="0">1 · 管理入口與 guard</tspan></text><text x="43" y="145" font-size="15" fill="#18344e" text-anchor="start"><tspan x="43" dy="0">labd → sriov_numvfs；admin mutex 序列化</tspan><tspan x="43" dy="22.5">拒絕 live lease / 改變非零 VF 數 / 超過 8 VF</tspan></text><path d="M325 185 L325 215" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#control-flow-arrow)"/><rect x="25" y="215" width="605" height="100" rx="12" fill="#edf4fc" stroke="#7792ae"/><text x="43" y="246" font-size="19" fill="#18344e" text-anchor="start"><tspan x="43" dy="0">2 · fwcore CREATE / COMMIT</tspan></text><text x="43" y="275" font-size="15" fill="#18344e" text-anchor="start"><tspan x="43" dy="0">先驗 slot / reserve / 資源上限</tspan><tspan x="43" dy="22.5">FREE → PROVISIONING → ACTIVE；先建立 ledger</tspan></text><path d="M325 315 L325 345" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#control-flow-arrow)"/><rect x="25" y="345" width="605" height="100" rx="12" fill="#edf4fc" stroke="#7792ae"/><text x="43" y="376" font-size="19" fill="#18344e" text-anchor="start"><tspan x="43" dy="0">3 · pci_enable_sriov</tspan></text><text x="43" y="405" font-size="15" fill="#18344e" text-anchor="start"><tspan x="43" dy="0">Linux 枚舉實際 PCI VF</tspan><tspan x="43" dy="22.5">建立 sysfs / IOMMU group；此時資料 gate 仍 fenced</tspan></text><path d="M325 445 L325 475" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#control-flow-arrow)"/><rect x="25" y="475" width="605" height="100" rx="12" fill="#edf4fc" stroke="#7792ae"/><text x="43" y="506" font-size="19" fill="#18344e" text-anchor="start"><tspan x="43" dy="0">4 · lease → VFIO owner</tspan></text><text x="43" y="535" font-size="15" fill="#18344e" text-anchor="start"><tspan x="43" dy="0">獨立 container、MAP SQ/CQ/payload</tspan><tspan x="43" dy="22.5">latch epoch → CONFIG_COMMIT → READY tuple</tspan></text><path d="M325 575 L325 605" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#control-flow-arrow)"/><rect x="25" y="605" width="605" height="100" rx="12" fill="#edf4fc" stroke="#7792ae"/><text x="43" y="636" font-size="19" fill="#18344e" text-anchor="start"><tspan x="43" dy="0">5 · PF REARM</tspan></text><text x="43" y="665" font-size="15" fill="#18344e" text-anchor="start"><tspan x="43" dy="0">核 lease / session / epoch / ready_gen</tspan><tspan x="43" dy="22.5">確認 RUNNING readback 才允許 tenant 提交</tspan></text><rect x="705" y="215" width="355" height="145" rx="12" fill="#fff2e5" stroke="#7792ae"/><text x="723" y="246" font-size="19" fill="#18344e" text-anchor="start"><tspan x="723" dy="0">失敗 unwind</tspan></text><text x="723" y="275" font-size="15" fill="#18344e" text-anchor="start"><tspan x="723" dy="0">移除已公開 VF（如有）</tspan><tspan x="723" dy="22.5">反向 destroy 已 provision slots</tspan><tspan x="723" dy="22.5">release 失敗仍保留 quota</tspan></text><path d="M630 265 L705 265" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#control-flow-arrow)"/><text x="668" y="248" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="668" dy="0">FAIL</tspan></text><path d="M630 395 L705 320" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#control-flow-arrow)"/><rect x="705" y="475" width="355" height="150" rx="12" fill="#fff2e5" stroke="#7792ae"/><text x="723" y="506" font-size="19" fill="#18344e" text-anchor="start"><tspan x="723" dy="0">owner 失敗 cleanup</tspan></text><text x="723" y="535" font-size="15" fill="#18344e" text-anchor="start"><tspan x="723" dy="0">先 fence / drain</tspan><tspan x="723" dy="22.5">exact UNMAP → close fds → lease release</tspan><tspan x="723" dy="22.5">短 UNMAP 保留 buffer 到 fd 關閉</tspan></text><path d="M630 525 L705 525" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#control-flow-arrow)"/><text x="668" y="507" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="668" dy="0">FAIL</tspan></text><text x="35" y="760" font-size="16" fill="#18344e" text-anchor="start"><tspan x="35" dy="0">T02 在真實 probe / provision / PCI 部分枚舉 / owner 階段注入故障，再驗證 cleanup 與 retry。</tspan></text></g></svg>
