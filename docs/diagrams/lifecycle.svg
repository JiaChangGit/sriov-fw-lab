<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 735" role="img" aria-labelledby="lifecycle-title"><title id="lifecycle-title">Firmware 主生命週期及 queue gate 的差別</title><defs><marker id="lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2b628f"/></marker></defs><rect width="100%" height="100%" fill="#fafcfe"/><g font-family="system-ui,Microsoft JhengHei,sans-serif"><text x="25" y="36" font-size="22" fill="#18344e" text-anchor="start"><tspan x="25" dy="0">Firmware lifecycle：主要路徑（完整 20 條轉移見下方來源表）</tspan></text><rect x="25" y="85" width="230" height="80" rx="12" fill="#edf4fc" stroke="#7792ae"/><text x="43" y="116" font-size="19" fill="#18344e" text-anchor="start"><tspan x="43" dy="0">FREE</tspan></text><text x="43" y="145" font-size="15" fill="#18344e" text-anchor="start"></text><rect x="365" y="85" width="230" height="80" rx="12" fill="#edf4fc" stroke="#7792ae"/><text x="383" y="116" font-size="19" fill="#18344e" text-anchor="start"><tspan x="383" dy="0">PROVISIONING</tspan></text><text x="383" y="145" font-size="15" fill="#18344e" text-anchor="start"></text><rect x="725" y="85" width="230" height="80" rx="12" fill="#edf4fc" stroke="#7792ae"/><text x="743" y="116" font-size="19" fill="#18344e" text-anchor="start"><tspan x="743" dy="0">ACTIVE</tspan></text><text x="743" y="145" font-size="15" fill="#18344e" text-anchor="start"></text><rect x="725" y="285" width="230" height="80" rx="12" fill="#edf4fc" stroke="#7792ae"/><text x="743" y="316" font-size="19" fill="#18344e" text-anchor="start"><tspan x="743" dy="0">QUIESCING</tspan></text><text x="743" y="345" font-size="15" fill="#18344e" text-anchor="start"></text><rect x="365" y="285" width="230" height="80" rx="12" fill="#edf4fc" stroke="#7792ae"/><text x="383" y="316" font-size="19" fill="#18344e" text-anchor="start"><tspan x="383" dy="0">RESETTING</tspan></text><text x="383" y="345" font-size="15" fill="#18344e" text-anchor="start"></text><rect x="25" y="285" width="230" height="80" rx="12" fill="#edf4fc" stroke="#7792ae"/><text x="43" y="316" font-size="19" fill="#18344e" text-anchor="start"><tspan x="43" dy="0">RECOVERING</tspan></text><text x="43" y="345" font-size="15" fill="#18344e" text-anchor="start"></text><rect x="365" y="500" width="230" height="80" rx="12" fill="#fff2e5" stroke="#7792ae"/><text x="383" y="531" font-size="19" fill="#18344e" text-anchor="start"><tspan x="383" dy="0">FAILED</tspan></text><text x="383" y="560" font-size="15" fill="#18344e" text-anchor="start"></text><rect x="725" y="500" width="230" height="80" rx="12" fill="#edf4fc" stroke="#7792ae"/><text x="743" y="531" font-size="19" fill="#18344e" text-anchor="start"><tspan x="743" dy="0">DESTROYING</tspan></text><text x="743" y="560" font-size="15" fill="#18344e" text-anchor="start"></text><path d="M255 125 L365 125" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#lifecycle-arrow)"/><text x="310.0" y="115.0" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="310.0" dy="0">CREATE</tspan></text><path d="M595 125 L725 125" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#lifecycle-arrow)"/><text x="660.0" y="115.0" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="660.0" dy="0">COMMIT</tspan></text><path d="M840 165 L840 285" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#lifecycle-arrow)"/><text x="895" y="225" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="895" dy="0">FENCE</tspan></text><path d="M725 325 L595 325" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#lifecycle-arrow)"/><text x="660.0" y="315.0" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="660.0" dy="0">DRAIN_OK</tspan></text><path d="M365 325 L255 325" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#lifecycle-arrow)"/><text x="310.0" y="315.0" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="310.0" dy="0">RESET_DONE</tspan></text><path d="M140 285 V218 H670 V125 H725" fill="none" stroke="#2b628f" stroke-width="2" marker-end="url(#lifecycle-arrow)"/><text x="320" y="207" font-size="15" fill="#18344e" text-anchor="start"><tspan x="320" dy="0">READY_REARM（核對 fresh CONFIG）</tspan></text><path d="M480 365 L480 500" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#lifecycle-arrow)"/><text x="570" y="445" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="570" dy="0">EV_TIMEOUT</tspan></text><path d="M140 365 V540 H365" fill="none" stroke="#2b628f" stroke-width="2" marker-end="url(#lifecycle-arrow)"/><text x="185" y="525" font-size="15" fill="#18344e" text-anchor="start"><tspan x="185" dy="0">VERIFY_FAIL</tspan></text><path d="M595 540 L725 540" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#lifecycle-arrow)"/><text x="660.0" y="530.0" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="660.0" dy="0">DESTROY</tspan></text><text x="25" y="625" font-size="16" fill="#18344e" text-anchor="start"><tspan x="25" dy="0">FLR：ACTIVE / QUIESCING / RESETTING / RECOVERING → RECOVERING（queue 清除、fence 保持）</tspan><tspan x="25" dy="24.0">RELEASE_OK：DESTROYING → FREE；release 失敗 → FAILED。FAILED 保留 quota；KILL 不因 FREE 自動解除。</tspan><tspan x="25" dy="24.0">ACTIVE 不是 RUNNING 的充分條件：硬體另檢查 config_valid、BME、fence、kill 與 generation。</tspan></text></g></svg>
