<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 1040" role="img" aria-labelledby="reset-sequence-title"><title id="reset-sequence-title">重置時 owner、driver、device 與健康 VF 的時序</title><defs><marker id="reset-sequence-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#2b628f"/></marker></defs><rect width="100%" height="100%" fill="#fafcfe"/><g font-family="system-ui,Microsoft JhengHei,sans-serif"><text x="24" y="34" font-size="22" fill="#18344e" text-anchor="start"><tspan x="24" dy="0">Reset with outstanding work · T07/T08 實作時序</tspan></text><text x="105" y="80" font-size="17" fill="#18344e" text-anchor="middle"><tspan x="105" dy="0">tenant A（owner）</tspan></text><path d="M105 96 V970" stroke="#9cadbe" stroke-dasharray="5 5"/><text x="385" y="80" font-size="17" fill="#18344e" text-anchor="middle"><tspan x="385" dy="0">labd + PF driver</tspan></text><path d="M385 96 V970" stroke="#9cadbe" stroke-dasharray="5 5"/><text x="660" y="80" font-size="17" fill="#18344e" text-anchor="middle"><tspan x="660" dy="0">device / fwcore</tspan></text><path d="M660 96 V970" stroke="#9cadbe" stroke-dasharray="5 5"/><text x="960" y="80" font-size="17" fill="#18344e" text-anchor="middle"><tspan x="960" dy="0">healthy VF B</tspan></text><path d="M960 96 V970" stroke="#9cadbe" stroke-dasharray="5 5"/><path d="M105 145 L660 145" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#reset-sequence-arrow)"/><text x="382.5" y="132" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="382.5" dy="0">SQ 已 fetch；completion 保留，outstanding=1</tspan></text><path d="M385 215 L105 215" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#reset-sequence-arrow)"/><text x="245.0" y="202" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="245.0" dy="0">STOP_REQUEST：停止新增提交</tspan></text><path d="M385 280 L660 280" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#reset-sequence-arrow)"/><text x="522.5" y="267" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="522.5" dy="0">FENCE → cancel / 清 IRQ → 換代；readback</tspan></text><path d="M105 345 L385 345" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#reset-sequence-arrow)"/><text x="245.0" y="332" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="245.0" dy="0">STOPPED：舊請求尚未完成</tspan></text><path d="M385 410 L660 410" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#reset-sequence-arrow)"/><text x="522.5" y="397" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="522.5" dy="0">QUIESCE / RESET → RECOVERING；仍 fenced</tspan></text><path d="M385 475 L105 475" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#reset-sequence-arrow)"/><text x="245.0" y="462" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="245.0" dy="0">RESET_NOTICE：新 epoch，outstanding=0</tspan></text><path d="M105 550 L385 550" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#reset-sequence-arrow)"/><text x="245.0" y="537" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="245.0" dy="0">舊 request ERROR；HELLO，刻意延後 READY</tspan></text><path d="M385 625 L105 625" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#reset-sequence-arrow)"/><text x="245.0" y="612" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="245.0" dy="0">允許配置：exact UNMAP 舊 IOVA → MAP 新 buffer</tspan></text><path d="M105 690 L660 690" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#reset-sequence-arrow)"/><text x="382.5" y="677" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="382.5" dy="0">CONFIG_COMMIT：新 epoch / 新 ready_gen</tspan></text><path d="M105 755 L385 755" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#reset-sequence-arrow)"/><text x="245.0" y="742" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="245.0" dy="0">READY：核 lease / peer / tuple</tspan></text><path d="M385 825 L660 825" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#reset-sequence-arrow)"/><text x="522.5" y="812" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="522.5" dy="0">REARM：解除 fence → RUNNING</tspan></text><path d="M385 900 L105 900" stroke="#2b628f" stroke-width="2" fill="none" marker-end="url(#reset-sequence-arrow)"/><text x="245.0" y="887" font-size="14" fill="#18344e" text-anchor="middle"><tspan x="245.0" dy="0">RUN：才可使用新 queue</tspan></text><rect x="840" y="160" width="240" height="590" rx="12" fill="#edf4fc" stroke="#7792ae"/><text x="858" y="191" font-size="19" fill="#18344e" text-anchor="start"><tspan x="858" dy="0">B 保持同 epoch</tspan></text><text x="858" y="220" font-size="15" fill="#18344e" text-anchor="start"><tspan x="858" dy="0">持續驗證固定 I/O</tspan><tspan x="858" dy="22.5"></tspan><tspan x="858" dy="22.5">A pending</tspan><tspan x="858" dy="22.5">A RECOVERING</tspan><tspan x="858" dy="22.5">A fresh CONFIG fenced</tspan><tspan x="858" dy="22.5">A resumed</tspan><tspan x="858" dy="22.5"></tspan><tspan x="858" dy="22.5">各階段核對進度</tspan><tspan x="858" dy="22.5">與 SQ/CQ/payload guard</tspan></text><text x="25" y="1010" font-size="16" fill="#18344e" text-anchor="start"><tspan x="25" dy="0">T08 在 fresh CONFIG fenced 與 REARM 後各執行一次舊 callback：要求只增加 STALE_CPL，無 DMA / IRQ。</tspan></text></g></svg>
